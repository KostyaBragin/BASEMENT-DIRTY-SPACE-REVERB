name: Build BASEMENT VST3
on:
  push:
    branches: [ main, diagnostic/minimal-vst3 ]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target BASEMENT_VST3
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          $plugin = Get-ChildItem -Path build -Recurse -Force | Where-Object {
            $_.PSIsContainer -and $_.Name -like "*.vst3"
          } | Select-Object -First 1
          if (-not $plugin) {
            Write-Host "VST3 bundle directories found under build:"
            Get-ChildItem -Path build -Recurse -Force | Where-Object { $_.PSIsContainer -and $_.Name -match "vst3|artefact" } | Select-Object -ExpandProperty FullName
            throw "No .vst3 bundle directory found after a successful build"
          }
          Write-Host "Packaging VST3 bundle: $($plugin.FullName)"
          Copy-Item -Path $plugin.FullName -Destination package/BASEMENT.vst3 -Recurse -Force
          $moduleInfo = "package/BASEMENT.vst3/Contents/Resources/moduleinfo.json"
          if (Test-Path $moduleInfo) {
            $jsonText = Get-Content $moduleInfo -Raw
            $jsonText = [regex]::Replace($jsonText, ',(\s*[}\]])', '$1')
            $parsed = $jsonText | ConvertFrom-Json
            $jsonText = $parsed | ConvertTo-Json -Depth 100
            [System.IO.File]::WriteAllText((Resolve-Path $moduleInfo), $jsonText, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Validated and normalized moduleinfo.json"
          } else {
            throw "VST3 moduleinfo.json is missing"
          }
          $binary = Get-ChildItem -Path package/BASEMENT.vst3/Contents/x86_64-win -Filter *.vst3 -File
          if (-not $binary) { throw "VST3 x64 binary is missing" }
          Write-Host "VST3 binary: $($binary.FullName), $($binary.Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: BASEMENT-VST3-Windows-x64
          path: package/BASEMENT.vst3
          if-no-files-found: error
