name: Build BASEMENT VST3
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target BASEMENT_VST3
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          $plugin = Get-ChildItem build -Directory -Recurse -Filter BASEMENT.vst3 | Select-Object -First 1
          if (-not $plugin) { throw "BASEMENT.vst3 not found" }
          Copy-Item $plugin.FullName package/BASEMENT.vst3 -Recurse
          Compress-Archive package/BASEMENT.vst3 BASEMENT-VST3-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BASEMENT-VST3-Windows-x64
          path: BASEMENT-VST3-Windows-x64.zip
          if-no-files-found: error
