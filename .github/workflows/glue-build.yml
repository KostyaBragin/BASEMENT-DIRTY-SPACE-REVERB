name: SM Production GLUE VST3
on:
  push:
    branches: [sm-production-glue]
    paths:
      - 'SM-PRODUCTION-GLUE/**'
      - '.github/workflows/glue-build.yml'
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S SM-PRODUCTION-GLUE -B build-glue -A x64
      - name: Build VST3
        run: cmake --build build-glue --config Release --target SMProductionGlue_VST3
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build-glue -Recurse -Directory -Filter "SM Production GLUE.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "VST3 bundle not found" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse $plugin.FullName package/
          Compress-Archive -Path package/* -DestinationPath SM-Production-GLUE-Windows-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SM-Production-GLUE-Windows-VST3
          path: SM-Production-GLUE-Windows-VST3.zip
          if-no-files-found: error
