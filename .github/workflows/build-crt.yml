name: Build SM Production CRT
on:
  push:
    branches: [crt-rebuild]
    paths:
      - 'CRT/**'
      - '.github/workflows/build-crt.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S CRT -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target SMProductionCRT_VST3
      - name: Package
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Directory -Recurse -Filter 'SM Production CRT.vst3' | Select-Object -First 1
          if (-not $plugin) { throw 'VST3 bundle not found' }
          Compress-Archive -Path $plugin.FullName -DestinationPath SM-Production-CRT-VST3.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SM-Production-CRT-VST3
          path: SM-Production-CRT-VST3.zip
          if-no-files-found: error
